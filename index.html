<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="jouw naam" />
    <meta name="color-scheme" content="dark light" />

    <title>strawb3rryb3ar</title>
    <link rel="stylesheet" href="./css/normal.css" />

    <!-- Voeg jouw eigen domein toe in data-page -->
    <script
      data-page="https://example.com"
      src="./scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header>
      <h1>strawb3rry b3ar</h1>
      
  
  <form>
    <label for="system-mode">
      <input type="radio" id="system-mode" name="color-theme" value="auto" checked> auto
    </label>
    <label for="light-mode">
      <input type="radio" id="light-mode" name="color-theme" value="light"> light
    </label>
    <label for="dark-mode">
      <input type="radio" id="dark-mode" name="color-theme" value="dark"> dark
    </label>
  </form>

      <nav>
        <a href="index.html">Home</a>
        <a href="https://github.com/account/repo">Learning Log</a>
      </nav>
    </header>

    <main>
      <nav>
        <ul class="no-bullets">
          <li>
            <button class="flowers">
              <picture class="persona">
                <source
                  srcset="images/sona-dark.png"
                  media="(prefers-color-scheme: dark)"
                />
                <img src="images/sona-light.png" />
              </picture>
            </button>
          </li>
          <li>
            <button popovertarget="blueflower" class="flowers">
              <picture>
                <source
                  srcset="images/flower1-dark.png"
                  media="(prefers-color-scheme: dark)"
                />
                <img src="images/flower1-light.png" />
              </picture>
            </button>
             </button>
            <div id="blueflower" popover>
              <h2>Art gallary</h2>
              <img src="images/mizisua.PNG" />
              <p>this is an illustration of...</p>
              <button popovertarget="blueflower" popovertargetaction="hide">
                Close
              </button>
          </li>
          <li>
            <button popovertarget="creepyflower" class="flowers">
              <picture>
                <source
                  srcset="images/flower2-dark.png"
                  media="(prefers-color-scheme: dark)"
                />
                <img
                  src="images/flower2-light.png"
                  alt="weird looking flower"
                />
              </picture>
            </button>
            <div id="creepyflower" popover>
              <h2>Art gallary</h2>
              <img src="images/abyssart.PNG" />
              <p>this is an illustration of...</p>
              <button popovertarget="creepyflower" popovertargetaction="hide">
                Close
              </button>
            </div>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
